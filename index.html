const CATS = ['ALL','PORTFOLIO','KEC OPS','AI TOOL','GAME','HARDWARE','PROTOCOL'];
const TECH_SET = new Set();
ARTIFACTS.forEach(a => a.tags.forEach(t => TECH_SET.add(t)));

document.getElementById('totalCount').textContent = ARTIFACTS.length;
document.getElementById('catCount').textContent = CATS.length - 1;
document.getElementById('techCount').textContent = TECH_SET.size;
const totalLines = ARTIFACTS.reduce((acc, a) => {
  const n = parseInt((a.lines || '0').replace(/[^0-9]/g, '')) || 0;
  return acc + n;
}, 0);
document.getElementById('linesCount').textContent = (totalLines / 1000).toFixed(0) + 'K+';

let currentCat = 'ALL';
let currentSearch = '';
let currentSort = 'rank';
let expandedId = null;

function getRankClass(rank) {
  if (rank === 1) return 'rank-top';
  if (rank <= 3) return 'rank-1';
  if (rank <= 6) return 'rank-2';
  return 'rank-3';
}

function getRankLabel(rank) {
  if (rank === 1) return '★ #1 FLAGSHIP';
  if (rank <= 3) return `#${rank} ELITE`;
  if (rank <= 10) return `#${rank} CORE`;
  return `#${rank}`;
}

function getBarColor(impact) {
  if (impact >= 90) return 'linear-gradient(90deg, #ffcc00, #ff0080)';
  if (impact >= 80) return 'linear-gradient(90deg, #00ff87, #60efff)';
  if (impact >= 70) return 'linear-gradient(90deg, #60efff, #00ff87)';
  return 'linear-gradient(90deg, #4a5580, #60efff)';
}

function statusColor(status) {
  if (status.includes('LIVE') || status.includes('DEPLOYED')) return '#00ff87';
  if (status.includes('DEV') || status.includes('BUILDING')) return '#ffcc00';
  if (status.includes('LEGACY')) return '#4a5580';
  return '#60efff';
}

function tagClass(t) {
  const map = { js:'tag-js', canvas:'tag-canvas', react:'tag-react', ai:'tag-ai', webgl:'tag-webgl', kec:'tag-kec', api:'tag-api', game:'tag-game', '3d':'tag-3d', node:'tag-node', python:'tag-python' };
  return map[t] || 'tag-js';
}

function filterAndSort() {
  let list = [...ARTIFACTS];
  if (currentCat !== 'ALL') list = list.filter(a => a.category === currentCat);
  if (currentSearch.trim()) {
    const q = currentSearch.toLowerCase();
    list = list.filter(a =>
      a.title.toLowerCase().includes(q) ||
      a.desc.toLowerCase().includes(q) ||
      a.tags.some(t => t.includes(q)) ||
      a.tech.toLowerCase().includes(q)
    );
  }
  if (currentSort === 'az') list.sort((a,b) => a.title.localeCompare(b.title));
  else if (currentSort === 'cat') list.sort((a,b) => a.category.localeCompare(b.category) || a.rank - b.rank);
  else list.sort((a,b) => a.rank - b.rank);
  return list;
}

function filterByTag(tag) {
  const ev = window.event;
  if (ev) ev.stopImmediatePropagation();
  currentSearch = tag;
  const inp = document.getElementById('searchInput');
  if (inp) inp.value = tag;
  expandedId = null;
  render();
}

function surpriseMe() {
  const list = filterAndSort();
  if (!list.length) return;
  const randIdx = Math.floor(Math.random() * list.length);
  const chosen = list[randIdx];
  expandedId = chosen.rank;
  render();
  setTimeout(() => {
    const el = document.querySelector(`[data-rank="${chosen.rank}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.boxShadow = '0 0 0 4px rgba(255,0,128,0.65)';
      setTimeout(() => {
        if (el) el.style.boxShadow = '0 8px 30px rgba(0,255,135,0.08), 0 0 0 1px rgba(0,255,135,0.1)';
      }, 1400);
    }
  }, 90);
}

function activateProtocolMode() {
  // Dynamically inject the hidden PROTOCOL filter button if it doesn't exist yet
  let protoBtn = document.querySelector('.filter-btn[data-cat="PROTOCOL"]');
  if (!protoBtn) {
    protoBtn = document.createElement('button');
    protoBtn.className = 'filter-btn';
    protoBtn.dataset.cat = 'PROTOCOL';
    protoBtn.textContent = 'PROTOCOL';
    protoBtn.style.borderColor = 'var(--pink)';
    protoBtn.style.color = 'var(--pink)';
    protoBtn.style.background = 'rgba(255,0,128,0.12)';
    // Insert before the sort select for visual flow
    const controls = document.querySelector('.controls');
    const sortSelect = document.getElementById('sortSelect');
    if (sortSelect && controls) {
      controls.insertBefore(protoBtn, sortSelect);
    } else if (controls) {
      controls.appendChild(protoBtn);
    }
    // Attach the same filter behavior as other category buttons
    protoBtn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      protoBtn.classList.add('active');
      currentCat = 'PROTOCOL';
      expandedId = null;
      render();
    });
  }
  // Activate it immediately
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  protoBtn.classList.add('active');
  currentCat = 'PROTOCOL';
  expandedId = null;
  // Keep the magic word in search so text filter still matches, or clear if you prefer
  // document.getElementById('searchInput').value = '';
  render();
  // Subtle confirmation flash on the new button
  setTimeout(() => {
    if (protoBtn) {
      protoBtn.style.boxShadow = '0 0 12px rgba(255,0,128,0.6)';
      setTimeout(() => { if (protoBtn) protoBtn.style.boxShadow = ''; }, 900);
    }
  }, 120);
}

function render() {
  const list = filterAndSort();
  const grid = document.getElementById('grid');
  const count = document.getElementById('resultCount');
  count.textContent = `SHOWING ${list.length} OF ${ARTIFACTS.length} ARTIFACTS`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty-state">// NO ARTIFACTS MATCH QUERY //</div>';
    return;
  }

  grid.innerHTML = list.map((a, i) => {
    const isExp = expandedId === a.rank;
    return `
    <div class="card${isExp ? ' expanded' : ''}" data-rank="${a.rank}"
         style="animation-delay:${i * 0.04}s">

      <div class="card-visual" style="background: linear-gradient(135deg, ${a.bgGrad[0]}, ${a.bgGrad[1]})">
        <span class="card-icon" style="color:${a.color}">${a.icon}</span>
      </div>

      <div class="rank-badge ${getRankClass(a.rank)}">${getRankLabel(a.rank)}</div>

      <div class="card-body">
        <div class="card-category" style="color:${a.color}">${a.category}</div>
        <div class="card-title">${a.title}</div>
        <div class="card-desc">${a.desc}</div>
        <div class="card-tags">
          ${a.tags.map(t => `<span class="tag ${tagClass(t)}">${t.toUpperCase()}</span>`).join('')}
        </div>
      </div>

      <div class="card-detail">
        <div class="impact-bar">
          <div class="impact-label"><span>IMPACT SCORE</span><span>${a.impact}/100</span></div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${a.impact}%;background:${getBarColor(a.impact)}"></div>
          </div>
        </div>

        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">TECH STACK</span>
            <span class="detail-val">${a.tech}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">EST. LINES</span>
            <span class="detail-val">${a.lines}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">STATUS</span>
            <span class="detail-val" style="color:${statusColor(a.status)}">${a.status}</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">WHY IT RANKS HERE</span>
            <span class="detail-val" style="color:#c8d6f0;font-size:0.68rem;line-height:1.4">${a.why}</span>
          </div>
        </div>

        <div style="margin-top:0.75rem;padding:0.6rem;background:rgba(0,255,135,0.04);border-radius:6px;border-left:2px solid ${a.color}">
          <div class="detail-label" style="margin-bottom:0.3rem">TECHNICAL DEPTH</div>
          <div style="font-size:0.72rem;line-height:1.55;color:#a0b0d0">${a.detail}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleExpand(rank) {
  expandedId = expandedId === rank ? null : rank;
  render();
  if (expandedId) {
    setTimeout(() => {
      const el = document.querySelector(`[data-rank="${rank}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

window.toggleExpand = toggleExpand;
window.filterByTag = filterByTag;
window.surpriseMe = surpriseMe;

    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    expandedId = null;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  currentSearch = e.target.value;
  expandedId = null;
  const q = currentSearch.toLowerCase().trim();
  if ((q === 'protocol' || q === 'godmode' || q === 'antman' || q.includes('protocol')) && currentCat !== 'PROTOCOL') {
    activateProtocolMode();
  } else {
    render();
  }
});

document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  render();
});

// Keyboard shortcut: / focuses search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName === 'BODY') {
    e.preventDefault();
    const inp = document.getElementById('searchInput');
    if (inp) inp.focus();
  }
  if (e.key.toLowerCase() === '?' && document.activeElement.tagName === 'BODY') {
    e.preventDefault();
    surpriseMe();
  }
});

// ── BG CANVAS (mouse-reactive particle field) ──────────────────────────────
const bgC = document.getElementById('bgCanvas');
const bgCtx = bgC.getContext('2d');
let bgW, bgH, particles = [];
let mouseX = -9999, mouseY = -9999;

bgC.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});
bgC.addEventListener('mouseleave', () => {
  mouseX = -9999;
  mouseY = -9999;
});

function resizeBg() {
  bgW = bgC.width = window.innerWidth;
  bgH = bgC.height = window.innerHeight;
}

function initParticles() {
  particles = [];
  const N = Math.min(85, Math.floor(bgW * bgH / 17500));
  const colors = ['#00ff87','#60efff','#ff0080','#ffcc00'];
  for (let i = 0; i < N; i++) {
    particles.push({
      x: Math.random() * bgW,
      y: Math.random() * bgH,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r: Math.random() * 1.6 + 0.45,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function drawBg() {
  bgCtx.clearRect(0, 0, bgW, bgH);

  particles.forEach(p => {
    // Mouse repulsion force (vector math)
    if (mouseX > -9000) {
      const dx = p.x - mouseX;
      const dy = p.y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist < 165 && dist > 1.5) {
        const repel = (165 - dist) / 165 * 1.35;
        p.vx += (dx / dist) * repel * 0.55;
        p.vy += (dy / dist) * repel * 0.55;
      }
    }

    // Integrate velocity
    p.x += p.vx;
    p.y += p.vy;

    // Wrap around edges
    if (p.x < 0) p.x = bgW;
    if (p.x > bgW) p.x = 0;
    if (p.y < 0) p.y = bgH;
    if (p.y > bgH) p.y = 0;

    // Velocity damping + speed clamp (feels organic)
    p.vx *= 0.982;
    p.vy *= 0.982;
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > 1.95) {
      p.vx = (p.vx / speed) * 1.95;
      p.vy = (p.vy / speed) * 1.95;
    }
  });

  // Draw connections (NEXUS neural net vibe)
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 118) {
        bgCtx.beginPath();
        bgCtx.strokeStyle = particles[i].c;
        bgCtx.globalAlpha = (1 - d / 118) * 0.28;
        bgCtx.lineWidth = 0.6;
        bgCtx.moveTo(particles[i].x, particles[i].y);
        bgCtx.lineTo(particles[j].x, particles[j].y);
        bgCtx.stroke();
      }
    }
  }
  bgCtx.globalAlpha = 1;

  // Draw particles
  particles.forEach(p => {
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = p.c;
    bgCtx.fill();
  });

  requestAnimationFrame(drawBg);
}

window.addEventListener('resize', () => { resizeBg(); initParticles(); });
resizeBg();
initParticles();
drawBg();

// Event delegation for robust .card + .tag clicks (replaces inline onclicks for reliability)
const gridEl = document.getElementById('grid');
gridEl.addEventListener('click', function(e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const rank = parseInt(card.dataset.rank, 10);
  if (e.target.closest('.tag')) {
    const tagEl = e.target.closest('.tag');
    const tagText = tagEl.textContent.toLowerCase().trim();
    filterByTag(tagText);
    e.stopImmediatePropagation();
    return;
  }
  toggleExpand(rank);
});
